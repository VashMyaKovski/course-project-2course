# Ollama: OpenAI-совместимый API на :11434 (путь /v1/chat/completions)
services:
  ollama:
    image: ollama/ollama:latest
    container_name: course-ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
